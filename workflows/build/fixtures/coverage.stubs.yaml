# The planner excuses red_check and implement for a brief that only asks for tests that pin
# behaviour that already works. The tests pass, so `red_check` prints `mutate` and the mutation
# cycle proves them. `implement` has no stub, so reaching it fails the fixture, and
# `impl_skipped` checks that nothing outside the tests lane changed.
fixture:
  expect: completed
  reached: [sync_base, settings, reuse, tests, red_check, mut_run, build_go, repair_ready, repair_state, impl_skipped, impl_join, report_pick, report, gates, shots, sync_start, sync_gates, sync_land, cleanup]
  inputs: { design: timer }
  resolved-text-contains:
    final_gate: "Excused red_check"
sync_base: main
settings: docs/briefs
slug_source: given
intake: timer
brief_location: docs/briefs/timer
gates_declared: "feature: npm run lint, npm test"
lanes_declared: ":(glob)test/**"
base_gates: green
handoffs_declared: none declared
plan_round: plan
spec:
  summary: Adds the timer feature.
  files: [src/feature.js]
  needs_decision: false
  question: ""
  excuses: [{ node: red_check, reason: "the brief only pins behaviour that already works" }, { node: implement, reason: "no source file changes" }]
  handoffs: []
  gaps: []
plan_record: no-ask
plan_decision: approve
tests_go: run
tests: wrote the tests
red_check: mutate
mut_run: caught
round: build
impl_go: skip
impl_skipped: ok
impl_join: ok
ask_mode: "no"
plan_rules: none
ask_check: go
review_go: go
review__scope: scoped
review__review: { clean: true }
review__verdict: clean
gates: green
reuse: fresh
build_go: go
repair_ready: no-repair
repair_state: go
ready: pause
report_pick: { findings: "", open_items: [], summary: "Adds the change.", picks: [], extra_json: "" }
report: "https://reports.example.net/myrepo/timer/review-report\ntimer is built, reviewed and green, and waits for you to land it.\nExcused red_check: the brief only pins behaviour that already works\nExcused implement: no source file changes\nMore tests need another run: a rework note cannot add them here."
shots: ""
final_gate: { decision: approve, text: "" }
ship_decision: land
sync_start: clean
sync_gates: green
sync_land: landed
handoff: no hand-offs
cleanup: landed on main; removed the worktree
