# A run started from the web chat or the command line has a message and no design slug.
# `slug_source` finds that no slug was given, so `name` asks a small model to name the work, and
# `intake` keeps the message as brief/<slug>/brief.md in the run's artifacts and prints the slug,
# and `brief_location` prints that directory, so the planner's prompt names the artifacts copy.
fixture:
  expect: completed
  reached: [sync_base, settings, slug_source, name, intake, handoffs_declared, reuse, brief_location, spec, tests, implement, sync_land, cleanup]
  inputs: {}
  resolved-text-contains:
    spec: brief/speech-usable-3f9a1c/
sync_base: main
settings: docs/briefs
slug_source: ask
name: { slug: speech-usable }
intake: speech-usable-3f9a1c
brief_location: /tmp/run/brief/speech-usable-3f9a1c
gates_declared: "feature: npm run lint, npm test"
lanes_declared: ":(glob)test/**"
base_gates: green
handoffs_declared: none declared
plan_round: plan
spec:
  summary: Adds the timer feature.
  files: [src/feature.js]
  needs_decision: false
  question: ""
  excuses: []
  handoffs: []
  gaps: []
plan_record: no-ask
plan_decision: approve
tests_go: run
tests: wrote the tests
red_check: red
round: build
impl_go: run
implement: { ask: false, question: "", steps: "", handoffs: [] }
impl_join: ok
